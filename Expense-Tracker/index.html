<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>

    <link href="./src/output.css" rel="stylesheet" />
  </head>

  <body
    class="min-h-screen bg-zinc-950 text-white flex items-center justify-center"
  >
    <div class="w-full max-w-md bg-zinc-900 rounded-xl p-6 shadow-2xl">
      <h1 class="text-2xl font-bold mb-5">Expense Tracker</h1>

      <form id="expense-form" class="flex gap-2 mb-6">
        <input
          type="text"
          id="expense-name"
          placeholder="Expense name"
          required
          class="flex-1 bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white placeholder-zinc-500 outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500"
        />

        <input
          type="number"
          id="expense-amount"
          placeholder="Amount"
          required
          class="w-24 bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white placeholder-zinc-500 outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500"
        />

        <button
          type="submit"
          class="bg-purple-600 hover:bg-purple-700 active:scale-95 transition-all rounded-lg px-4 py-2 text-sm font-semibold"
        >
          Add
        </button>
      </form>

      <h2 class="text-lg font-semibold text-center mb-3">Expenses</h2>

      <ul id="expense-list" class="space-y-2"></ul>

      <div class="border-t border-zinc-700 mt-5 pt-4 text-center">
        <h3 class="text-sm text-zinc-400">Total</h3>

        <p class="text-xl font-bold text-purple-400">
          $<span id="total-amount">0.00</span>
        </p>
      </div>
    </div>

    <script src="expense.js"></script>
  </body>
</html>
